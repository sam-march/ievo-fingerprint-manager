name: Build Fingerprint Access Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # WINDOWS BUILD
  # ==========================================================

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Show repository files
        run: |
          dir

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name "Fingerprint Access Manager" fingerprint_manager.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fingerprint-Access-Manager-Windows
          path: dist/Fingerprint Access Manager.exe
          if-no-files-found: error


  # ==========================================================
  # MAC BUILD
  # ==========================================================

  build-mac:
    name: Build Mac App
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Show repository files
        run: |
          ls -la

      - name: Build Mac App
        run: |
          pyinstaller --windowed --name "Fingerprint Access Manager" fingerprint_manager.py

      - name: Zip Mac App
        run: |
          ditto -c -k --keepParent "dist/Fingerprint Access Manager.app" "Fingerprint Access Manager Mac.zip"

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Fingerprint-Access-Manager-Mac
          path: Fingerprint Access Manager Mac.zip
          if-no-files-found: error