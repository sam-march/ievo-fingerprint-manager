name: Build Windows and Mac Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name "Fingerprint Access Manager" main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fingerprint-Access-Manager-Windows
          path: dist/Fingerprint Access Manager.exe


  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Mac App
        run: |
          pyinstaller --windowed --name "Fingerprint Access Manager" main.py

      - name: Zip Mac App
        run: |
          ditto -c -k --keepParent "dist/Fingerprint Access Manager.app" "Fingerprint Access Manager Mac.zip"

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Fingerprint-Access-Manager-Mac
          path: Fingerprint Access Manager Mac.zip
